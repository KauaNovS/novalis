version: '3.8'

services:
  # ============================================
  # PostgreSQL - Banco Principal
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: novalis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: novalis_dev_password
      POSTGRES_DB: novalis
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neondb_owner -d novalis"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novalis-net

  # ============================================
  # Redis - Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: novalis-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novalis-net

  # ============================================
  # PgAdmin - Gerenciador PostgreSQL
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: novalis-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@novalis.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'True'
      PGADMIN_CONFIG_COOKIE_SAMESITE: 'Lax'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - novalis-net

  # ============================================
  # Minio - S3 Local (Opcional)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: novalis-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - novalis-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  minio_data:
    driver: local

networks:
  novalis-net:
    driver: bridge

# ============================================
# Como usar:
# ============================================
# docker-compose up -d           # Iniciar tudo
# docker-compose down            # Parar tudo
# docker-compose logs -f         # Ver logs
# docker-compose ps              # Status dos serviços
#
# URLs de acesso:
# - PostgreSQL:  localhost:5432  (neondb_owner / novalis_dev_password)
# - PgAdmin:     localhost:5050  (admin@novalis.local / admin)
# - Redis:       localhost:6379
# - Minio:       localhost:9000  (minioadmin / minioadmin123)
# - Minio UI:    localhost:9001
